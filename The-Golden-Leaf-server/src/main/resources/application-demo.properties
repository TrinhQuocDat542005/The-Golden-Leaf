# Isolated portfolio sandbox. Not an authentication mode for dev/prod databases.
server.address=127.0.0.1
spring.datasource.url=jdbc:h2:mem:golden_leaf_demo;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=false
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.flyway.enabled=true
app.firebase.enabled=false
app.firebase.web-api-key=
app.security.require-auth=true
app.notification.delivery-enabled=false
app.booking.require-physical-inventory=true
app.payment.bank-name=DEMO - KHONG CHUYEN TIEN
app.payment.account-number=NOT-A-REAL-ACCOUNT
app.payment.account-name=PORTFOLIO FIXTURE ONLY
app.security.rate-limit.enabled=true
app.security.rate-limit.requests-per-minute=600
management.endpoints.web.exposure.include=health,info
