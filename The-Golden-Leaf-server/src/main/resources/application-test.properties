spring.datasource.url=jdbc:h2:mem:datban_test;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.flyway.enabled=true
app.firebase.enabled=false
app.security.require-auth=false
app.booking.expiry-enabled=false
app.operations.metrics-enabled=false
