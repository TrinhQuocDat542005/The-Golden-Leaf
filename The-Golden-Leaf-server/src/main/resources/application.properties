

spring.application.name=datban
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}
server.port=${SERVER_PORT:8080}

management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
spring.jpa.open-in-view=false
spring.jackson.time-zone=UTC
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
springdoc.paths-to-match=/api/**

app.booking.hold-duration=${BOOKING_HOLD_DURATION:PT15M}
app.booking.zone=${RESTAURANT_TIME_ZONE:Asia/Ho_Chi_Minh}
app.booking.table-fee=${BOOKING_TABLE_FEE:200000.00}
app.booking.expiry-delay-ms=${BOOKING_EXPIRY_DELAY_MS:60000}

app.firebase.enabled=${FIREBASE_ENABLED:false}
app.security.require-auth=${REQUIRE_AUTH:false}
firebase.credentials.path=${FIREBASE_CREDENTIALS_PATH:src/main/resources/firebase/serviceAccountKey.json}
app.payment.bank-name=${PAYMENT_BANK_NAME:}
app.payment.account-number=${PAYMENT_ACCOUNT_NUMBER:}
app.payment.account-name=${PAYMENT_ACCOUNT_NAME:}
app.firebase.web-api-key=${FIREBASE_WEB_API_KEY:}
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=30s
server.forward-headers-strategy=none
management.endpoint.health.show-details=never
management.endpoint.health.group.readiness.include=readinessState,db
app.operations.metrics-enabled=${OPERATIONS_METRICS_ENABLED:true}
app.monitoring.token=${MONITORING_TOKEN:}
app.security.rate-limit.enabled=${RATE_LIMIT_ENABLED:false}
app.security.rate-limit.requests-per-minute=${RATE_LIMIT_REQUESTS_PER_MINUTE:120}
app.security.rate-limit.max-clients=10000
app.notification.delivery-enabled=${PUSH_DELIVERY_ENABLED:true}
