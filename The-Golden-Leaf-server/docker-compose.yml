services:
  mysql:
    image: mysql:8.0
    container_name: mysql_datban
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-local-root-password}
      MYSQL_DATABASE: ${DB_NAME:-datban_db}
      MYSQL_USER: ${DB_USERNAME:-datban}
      MYSQL_PASSWORD: ${DB_PASSWORD:-local-datban-password}
    ports:
      - "${DB_HOST_PORT:-3308}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "--password=${DB_ROOT_PASSWORD:-local-root-password}"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
    container_name: golden_leaf_backend
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: dev
      DB_URL: jdbc:mysql://mysql:3306/${DB_NAME:-datban_db}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      DB_USERNAME: ${DB_USERNAME:-datban}
      DB_PASSWORD: ${DB_PASSWORD:-local-datban-password}
      FIREBASE_ENABLED: ${FIREBASE_ENABLED:-false}
      REQUIRE_AUTH: ${REQUIRE_AUTH:-false}
      BOOKING_HOLD_DURATION: ${BOOKING_HOLD_DURATION:-PT15M}
      RESTAURANT_TIME_ZONE: ${RESTAURANT_TIME_ZONE:-Asia/Ho_Chi_Minh}
      BOOKING_EXPIRY_DELAY_MS: ${BOOKING_EXPIRY_DELAY_MS:-60000}
      BOOKING_TABLE_FEE: ${BOOKING_TABLE_FEE:-200000.00}
      FIREBASE_CREDENTIALS_PATH: /run/secrets/firebase-service-account.json
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    volumes:
      - uploads_data:/app/uploads
      - ${FIREBASE_CREDENTIALS_HOST_PATH:-./secrets/firebase-service-account.example.json}:/run/secrets/firebase-service-account.json:ro
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8080/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s

  phpmyadmin:
    image: phpmyadmin/phpmyadmin:latest
    container_name: phpmyadmin_datban
    restart: unless-stopped
    profiles: ["tools"]
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      PMA_HOST: mysql
      PMA_USER: ${DB_USERNAME:-datban}
      PMA_PASSWORD: ${DB_PASSWORD:-local-datban-password}
    ports:
      - "8082:80"

volumes:
  mysql_data:
  uploads_data:
