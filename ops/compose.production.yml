name: golden-leaf-production
services:
  db:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_NAME:-datban_db}
      MYSQL_USER: ${DB_USERNAME:-datban}
      MYSQL_PASSWORD_FILE: /run/secrets/db_password
      MYSQL_ROOT_PASSWORD_FILE: /run/secrets/db_root_password
    secrets: [db_password, db_root_password]
    volumes: [mysql_data:/var/lib/mysql]
    networks: [database]
    healthcheck:
      test: [CMD, mysqladmin, ping, -h, localhost]
      interval: 10s
      timeout: 5s
      retries: 15
    logging: &logs
      driver: json-file
      options:
        max-size: 10m
        max-file: '5'
  backend:
    image: ${BACKEND_IMAGE:?Set an immutable verified backend image tag}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SPRING_CONFIG_IMPORT: configtree:/run/secrets/
      DB_URL: jdbc:mysql://db:3306/${DB_NAME:-datban_db}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      DB_USERNAME: ${DB_USERNAME:-datban}
      FIREBASE_CREDENTIALS_PATH: /run/secrets/firebase.json
      FIREBASE_WEB_API_KEY: ${FIREBASE_WEB_API_KEY:?Set Firebase Web API key}
      PAYMENT_BANK_NAME: ${PAYMENT_BANK_NAME:?Set actual receiving bank}
      PAYMENT_ACCOUNT_NUMBER: ${PAYMENT_ACCOUNT_NUMBER:?Set actual receiving account}
      PAYMENT_ACCOUNT_NAME: ${PAYMENT_ACCOUNT_NAME:?Set actual account holder}
      MONITORING_TOKEN: ${MONITORING_TOKEN:?Set private monitoring bearer token}
      RESTAURANT_TIME_ZONE: ${RESTAURANT_TIME_ZONE:-Asia/Ho_Chi_Minh}
      BOOKING_TABLE_FEE: ${BOOKING_TABLE_FEE:-200000.00}
      RATE_LIMIT_REQUESTS_PER_MINUTE: ${RATE_LIMIT_REQUESTS_PER_MINUTE:-3000}
      PUSH_DELIVERY_ENABLED: ${PUSH_DELIVERY_ENABLED:-true}
    secrets:
      - source: db_password
        target: DB_PASSWORD
      - source: firebase_credentials
        target: firebase.json
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs: ['/tmp:rw,noexec,nosuid,size=128m']
    volumes: [uploads_data:/app/uploads]
    networks: [database, edge, outbound]
    # No host publish for business/management ports; proxy only exposes TLS.
    healthcheck:
      test: [CMD, curl, --fail, --silent, http://localhost:8081/actuator/health/readiness]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 45s
    stop_grace_period: 45s
    mem_limit: 768m
    cpus: 1.5
    logging: *logs
  proxy:
    image: nginx:1.28-alpine
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports: ['443:443']
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/proxy_params_goldenleaf:/etc/nginx/proxy_params_goldenleaf:ro
      - ./tls:/etc/nginx/tls:ro
    networks: [edge]
    read_only: true
    tmpfs: [/var/cache/nginx, /var/run, /tmp]
    security_opt: [no-new-privileges:true]
    logging: *logs
networks:
  database:
    internal: true
  edge:
    internal: true
  outbound: {}
volumes:
  mysql_data: {}
  uploads_data: {}
secrets:
  db_password:
    file: ./secrets/db-password
  db_root_password:
    file: ./secrets/db-root-password
  firebase_credentials:
    file: ./secrets/firebase-service-account.json
