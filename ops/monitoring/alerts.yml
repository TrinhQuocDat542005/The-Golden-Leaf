groups:
  - name: golden-leaf
    rules:
      - alert: GoldenLeafScrapeUnavailable
        expr: up{job="golden-leaf"} == 0
        for: 2m
        labels: {severity: critical}
        annotations:
          summary: Backend metrics inaccessible; check service, network and monitoring credential
      - alert: GoldenLeafApiServerErrors
        expr: sum(rate(http_server_requests_seconds_count{job="golden-leaf",status=~"5.."}[5m])) / clamp_min(sum(rate(http_server_requests_seconds_count{job="golden-leaf"}[5m])), 0.01) > 0.05
        for: 5m
        labels: {severity: critical}
        annotations:
          summary: API 5xx ratio exceeds 5 percent
      - alert: GoldenLeafDeliveryFailures
        expr: goldenleaf_notification_deliveries{status="FAILED"} > 0
        for: 10m
        labels: {severity: warning}
        annotations:
          summary: Push deliveries need staff review
      - alert: GoldenLeafRefundsOutstanding
        expr: goldenleaf_payment_refunds_required > 0
        for: 30m
        labels: {severity: warning}
        annotations:
          summary: Manual refunds require accounting review (count, not individual age)
      - alert: GoldenLeafExpiredHoldsNotReclaimed
        expr: goldenleaf_booking_holds_overdue > 0
        for: 3m
        labels: {severity: warning}
        annotations:
          summary: Booking expiry sweep may be stalled
      - alert: GoldenLeafMetricsSnapshotStale
        expr: goldenleaf_operations_snapshot_age_seconds > 120 or goldenleaf_operations_snapshot_age_seconds < 0
        for: 2m
        labels: {severity: critical}
        annotations:
          summary: Business metrics snapshot unavailable or stale
