events { worker_connections 1024; }
http {
    server_tokens off;
    # Deliberately omit URL, args, credentials and client IP from access logs.
    log_format safe '$request_method $status $request_time';
    access_log /dev/stdout safe;
    error_log /dev/stderr warn;
    limit_req_zone $binary_remote_addr zone=api:10m rate=10r/s;
    limit_req_zone $binary_remote_addr zone=auth:10m rate=5r/m;
    limit_req_status 429;
    client_max_body_size 6m;
    client_body_timeout 10s;
    client_header_timeout 10s;
    keepalive_timeout 30s;
    server {
        listen 443 ssl;
        server_name _;
        ssl_certificate /etc/nginx/tls/fullchain.pem;
        ssl_certificate_key /etc/nginx/tls/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        add_header Strict-Transport-Security 'max-age=31536000' always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy no-referrer always;
        add_header Permissions-Policy 'camera=(), microphone=(), geolocation=()' always;
        # Never expose probes/metrics/admin tooling to public routing.
        location /actuator { return 404; }
        location /swagger { return 404; }
        location /v3/api-docs { return 404; }
        location /api/auth/ {
            limit_req zone=auth burst=10 nodelay;
            proxy_pass http://backend:8080;
            include /etc/nginx/proxy_params_goldenleaf;
        }
        location /api/ {
            limit_req zone=api burst=20 nodelay;
            proxy_pass http://backend:8080;
            include /etc/nginx/proxy_params_goldenleaf;
        }
        location / {
            proxy_pass http://backend:8080;
            include /etc/nginx/proxy_params_goldenleaf;
        }
    }
}
