name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
  actions: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  backend:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: ci-test-only-password
          MYSQL_DATABASE: golden_leaf_week3_test
        ports: ['13308:3306']
        options: >-
          --health-cmd="mysqladmin ping -h localhost -uroot -pci-test-only-password"
          --health-interval=10s --health-timeout=5s --health-retries=15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          cache-dependency-path: The-Golden-Leaf-server/pom.xml
      - name: Verify H2 and disposable MySQL suites
        working-directory: The-Golden-Leaf-server
        env:
          MYSQL_TEST_URL: jdbc:mysql://127.0.0.1:13308/golden_leaf_week3_test?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
          MYSQL_TEST_PASSWORD: ci-test-only-password
        run: bash mvnw -B verify
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - name: Verify real disposable backend restart invalidates old demo tokens
        run: node scripts/test-demo-recovery.mjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: backend-test-reports
          path: The-Golden-Leaf-server/target/surefire-reports
          retention-days: 14
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Install Android SDK components
        run: '"$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" ''platforms;android-36'' ''build-tools;36.0.0'''
      - name: Debug unit tests, assembly and lint
        run: |
          bash gradlew --no-daemon testDebugUnitTest assembleDebug assembleDemo assembleDebugAndroidTest
          bash gradlew --no-daemon lintDebug
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - name: Enforce lint budget and static log privacy
        run: node scripts/check-android-quality.mjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: android-debug-and-reports
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/demo/*.apk
            app/build/reports/tests/testDebugUnitTest
            app/build/reports/lint-results-debug.*
          retention-days: 14
  infrastructure:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - run: node --check The-Golden-Leaf-server/src/main/resources/static/staff.js
      - run: node --check The-Golden-Leaf-server/src/main/resources/static/demo.js
      - run: node --test scripts/check-android-quality.test.mjs scripts/check-security-report.test.mjs scripts/check-android-instrumentation.test.mjs scripts/build-demo-bundle.test.mjs
      - run: docker run --rm --network none -v "$PWD:/repo:ro" -w /repo rhysd/actionlint:1.7.7@sha256:887a259a5a534f3c4f36cb02dca341673c6089431057242cdc931e9f133147e9
      - run: docker run --rm --network none -v "$PWD:/repo:ro" -w /repo --entrypoint shellcheck rhysd/actionlint:1.7.7@sha256:887a259a5a534f3c4f36cb02dca341673c6089431057242cdc931e9f133147e9 -x ops/scripts/*.sh
      - run: bash -n ops/scripts/*.sh ops/demo/*.sh
      - run: docker run --rm --network none -v "$PWD:/repo:ro" -w /repo --entrypoint shellcheck rhysd/actionlint:1.7.7@sha256:887a259a5a534f3c4f36cb02dca341673c6089431057242cdc931e9f133147e9 -x ops/demo/*.sh
      - run: bash ops/scripts/test-backup-restore.sh
      - run: docker build --tag golden-leaf:ci The-Golden-Leaf-server
      - run: bash ops/scripts/test-container.sh
  demo-browser:
    needs: [backend, android, infrastructure, android-emulator, security]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          cache-dependency-path: The-Golden-Leaf-server/pom.xml
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: tools/demo-browser/package-lock.json
      - name: Package backend for isolated demo
        working-directory: The-Golden-Leaf-server
        run: bash mvnw -B -DskipTests package
      - name: Install locked browser test dependencies
        working-directory: tools/demo-browser
        run: npm ci && npx playwright install --with-deps chromium
      - name: Verify real demo customer/staff/admin journeys
        working-directory: tools/demo-browser
        run: npm test
      - name: Prepare verified local demo bundle
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" --name android-emulator-api-35 --dir build/week10/verified-native
          node scripts/build-demo-bundle.mjs --jar The-Golden-Leaf-server/target/datban-0.0.1-SNAPSHOT.jar --apk build/week10/verified-native/build/week10/verified-demo.apk --revision "$GITHUB_SHA" --output demo-bundle
          node scripts/test-demo-launcher.mjs demo-bundle
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: portfolio-demo-bundle
          path: demo-bundle
          retention-days: 14
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: demo-browser-report-and-video
          path: |
            tools/demo-browser/playwright-report
            tools/demo-browser/test-results
          retention-days: 14
  portfolio-release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: demo-browser
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
      DEMO_TAG: portfolio-v0.10.0
    steps:
      - name: Check explicit portfolio tag points to this verified commit
        id: approval
        run: |
          tag_sha=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$DEMO_TAG" --jq 'select(.object.type == "commit") | .object.sha' 2>/dev/null || true)
          if [[ "$tag_sha" == "$GITHUB_SHA" ]]; then
            echo 'publish=true' >> "$GITHUB_OUTPUT"
          else
            echo 'No matching explicit portfolio tag; no release will be published.'
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.approval.outputs.publish == 'true'
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        if: steps.approval.outputs.publish == 'true'
        with:
          node-version: '24'
      - name: Download and recheck exact-run demo bundle
        if: steps.approval.outputs.publish == 'true'
        run: |
          gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" --name portfolio-demo-bundle --dir release-bundle
          node scripts/build-demo-bundle.mjs --verify release-bundle "$GITHUB_SHA"
          (cd release-bundle && sha256sum -c SHA256SUMS)
          (cd release-bundle && zip golden-leaf-portfolio-demo.zip ./*)
          (cd release-bundle && sha256sum golden-leaf-portfolio-demo.zip golden-leaf-demo.apk golden-leaf-demo.jar > RELEASE-SHA256SUMS)
      - name: Publish local-only prerelease after all acceptance gates
        if: steps.approval.outputs.publish == 'true'
        run: |
          gh release create "$DEMO_TAG" --repo "$GITHUB_REPOSITORY" --verify-tag --draft --prerelease --latest=false --title 'The Golden Leaf — Portfolio demo v0.10.0' --notes-file docs/week-10-release-notes.md release-bundle/golden-leaf-portfolio-demo.zip release-bundle/golden-leaf-demo.apk release-bundle/golden-leaf-demo.jar release-bundle/RELEASE-SHA256SUMS
          gh release view "$DEMO_TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '[.assets[].name] | sort' > release-bundle/published-assets.json
          node -e 'const fs=require("fs"),assert=require("assert");assert.deepStrictEqual(JSON.parse(fs.readFileSync("release-bundle/published-assets.json","utf8")),["RELEASE-SHA256SUMS","golden-leaf-demo.apk","golden-leaf-demo.jar","golden-leaf-portfolio-demo.zip"]);'
          gh release edit "$DEMO_TAG" --repo "$GITHUB_REPOSITORY" --draft=false
  android-emulator:
    needs: [backend, android]
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        api: [25, 35]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Enable KVM for disposable emulator
        run: sudo chmod a+rw /dev/kvm
      - name: Install native recording validation tools
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - name: Package isolated demo
        working-directory: The-Golden-Leaf-server
        run: bash mvnw -B -DskipTests package
      - name: Component regression and full native customer demo journeys
        env:
          ANDROID_TEST_API: ${{ matrix.api }}
        run: bash ops/scripts/test-android-emulator.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: android-emulator-api-${{ matrix.api }}
          path: |
            app/build/reports/androidTests
            app/build/outputs/androidTest-results
            build/week8/*.log
            build/week8/android-logcat.txt
            build/week8/android-*.png
            build/week8/android-*-window.txt
            build/week8/instrumentation-results.*
            build/week9/android-*.png
            build/week9/android-*-window.txt
            build/week9/android-demo.mp4
            build/week9/android-demo.webm
            build/week9/video-validation.log
            build/week9/video-metadata.json
            build/week9/android-logcat.txt
            build/week9/screenrecord.log
            build/week9/screenrecord-stop.log
            build/week9/instrumentation-results.*
            build/week10/verified-demo.apk
          retention-days: 14
  security:
    needs: backend
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          cache-dependency-path: The-Golden-Leaf-server/pom.xml
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - name: Package dependencies and image for local scanning
        run: |
          (cd The-Golden-Leaf-server && bash mvnw -B -DskipTests package)
          docker build -t golden-leaf:security The-Golden-Leaf-server
          mkdir -p build/week8/security build/week8/trivy-cache
          docker save golden-leaf:security -o build/week8/security/backend-image.tar
      - name: Scan Java dependency inventory and image OS/libraries
        env:
          TRIVY_IMAGE: aquasec/trivy:0.75.0@sha256:af6acf9a6b85dfe389a1941505c0ce9efef52a4719635e1a962f022a3d855daa
        run: |
          docker run --rm -e TRIVY_DISABLE_TELEMETRY=true -v "$PWD/The-Golden-Leaf-server/target:/scan:ro" -v "$PWD/build/week8/security:/reports" -v "$PWD/build/week8/trivy-cache:/root/.cache/trivy" "$TRIVY_IMAGE" rootfs --scanners vuln --format json --output /reports/backend-dependencies.json /scan
          docker run --rm -e TRIVY_DISABLE_TELEMETRY=true -v "$PWD/build/week8/security:/reports" -v "$PWD/build/week8/trivy-cache:/root/.cache/trivy" "$TRIVY_IMAGE" image --input /reports/backend-image.tar --scanners vuln --format json --output /reports/backend-image.json
      - name: Reject incomplete scans and fixable high/critical vulnerabilities
        run: |
          node scripts/check-security-report.mjs build/week8/security/backend-dependencies.json
          node scripts/check-security-report.mjs build/week8/security/backend-image.json --image
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: security-inventory-and-vulnerabilities
          path: build/week8/security/*.json
          retention-days: 14
